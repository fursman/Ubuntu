# hyprlock — the lock screen. Colours come from the theme (desktop-theme
# writes hyprlock-colors.conf). Sized for scale-1 4K / 32:9 panels.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.15
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = $fg
    font_size = 160
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 2
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A %-d %B'
    color = $accent
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 2
}

input-field {
    monitor =
    size = 640, 96
    outline_thickness = 3
    rounding = 18
    dots_size = 0.28
    dots_spacing = 0.4
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $fg
    check_color = $check
    fail_color = $fail
    capslock_color = $caps
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span alpha="55%">  $USER</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
}

# Hint
label {
    monitor =
    text = Type your password · Enter to unlock
    color = $muted
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -190
    halign = center
    valign = center
}

# Voice unlock (the voice-assistant repo's contrib/voice-unlock): the phrase
# to say. The script prints nothing when voice unlock is off or not installed,
# so the label is empty everywhere else. cmd[] runs under sh: keep it a path.
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/voice-unlock-phrase 2>/dev/null
    color = $fg
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -250
    halign = center
    valign = center
    shadow_passes = 2
}
