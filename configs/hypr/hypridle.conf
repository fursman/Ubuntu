# hypridle — what happens when you walk away. Started from hyprland.lua.
#
# Anything that inhibits idle pauses all of this: a video player or browser
# playing media, and the stay-awake toggle (Super+Ctrl+I).
# Times are seconds of no input.

general {
    lock_cmd = ~/.local/bin/lock-screen
    before_sleep_cmd = loginctl lock-session
    # Lua dispatch syntax: under a Lua config the old `dpms on` form fails to parse.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3      # suspend waits until the lock screen is up
}

# Screensaver after 5 minutes; the lock follows at 60 (screensaver off with:
# desktop-menu toggle).
listener {
    timeout = 300
    on-timeout = ~/.local/bin/screensaver start
    on-resume = ~/.local/bin/screensaver stop
}

listener {
    timeout = 3600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 3660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
