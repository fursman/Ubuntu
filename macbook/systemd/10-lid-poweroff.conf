# MacBook Pro: no sleep mode on this hardware ever resumes, so the lid does a
# clean shutdown instead. See README.md in this directory for what was tested.
#
# All three lid variants, because "docked" and "on external power" are separate
# settings and leaving either at the default means the lid still suspends there.
# LidSwitchIgnoreInhibited overrides the desktop's inhibitor, which otherwise
# takes the lid event for itself and suspends anyway.
[Login]
HandleLidSwitch=poweroff
HandleLidSwitchExternalPower=poweroff
HandleLidSwitchDocked=poweroff
LidSwitchIgnoreInhibited=yes
HandlePowerKey=poweroff
InhibitDelayMaxSec=5
