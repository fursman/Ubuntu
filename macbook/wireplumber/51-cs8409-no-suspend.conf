# Never suspend the analog nodes of the Cirrus CS8409 codec (MacBook Pro):
# closing the playback side of this card freezes any capture in progress.
# Matched on the codec id, so this is inert on any other sound card.
# See macbook/README.md in github.com/fursman/Ubuntu.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_(output|input)\\..*", alsa.components = "~.*HDA:10138409.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
