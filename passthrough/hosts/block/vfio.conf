# Give vfio-pci first claim on the 4090 before any competing driver loads.
# The device IDs live ONLY on the passthrough entry's kernel cmdline
# (vfio-pci.ids=), so this file is inert on the normal boot entry.
softdep nvidia          pre: vfio-pci
softdep nvidia_drm      pre: vfio-pci
softdep nvidia_modeset  pre: vfio-pci
softdep nvidia_uvm      pre: vfio-pci
# Load-bearing on this box: snd_hda_intel binds 01:00.1 (the GPU's HDMI audio)
# at boot. Whichever driver binds first wins; without this the audio function
# gets captured by ALSA, splitting IOMMU group 17 across drivers and failing the
# VM with "group not viable".
softdep snd_hda_intel   pre: vfio-pci
